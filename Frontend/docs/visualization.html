<h1 class="content-title">Suspicious Node Detection</h1>

<div class="d-flex flex-column flex-fill">
    <div class="d-flex flex-grow-1">
        <div class="body-content flex-grow-1 d-flex flex-column">
            <div class="sub-header">
                <div class="form-check form-switch d-flex align-items-center">
                    <input class="form-check-input me-2 mb-1" type="checkbox" id="annotationToggle">
                    <label class="form-check-label mb-0" for="annotationToggle">Enable Graph Annotation</label>
                    <button id="clearAnnotationsBtn" class="btn btn-outline-secondary btn-sm ms-3" style="border-color: black; color: black;">Clear Annotations</button>
                    <button id="revertAnnotationsBtn" class="btn btn-outline-secondary btn-sm ms-2" style="border-color: black; color: black;">Reverse Annotations</button>
                    <div class="d-flex align-items-center" style="padding-left: 20px">
                        <input
                                type="text"
                                id="nodeSearch"
                                class="form-control bg-white shadow-md rounded px-8"
                                placeholder="Search nodes by name or attribute..."
                                style="width: 400px"
                        />
                        <button id="nodeSearchBtn" class="btn btn-primary btn-sm ms-2">Search</button>
                        <button id="clearSearchBtn" class="btn btn-outline-secondary btn-sm ms-3" style="margin-left: 10px">Clear</button>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; margin-left: 20px; font:12px system-ui, sans-serif">
                        <span>0.0</span>
                        <div style="height:12px; width:180px; border-radius:6px;
                            background: linear-gradient(to right, #00b2ff 0%, #00ff5d 50%, #ff0000 100%);">

                        </div>
                        <span>1.0</span>
                    </div>
                </div>
            </div>

            <label for="predictionSelect"></label><select id="predictionSelect" class="form-select w-auto mb-3" style="display: none;">
                <option disabled selected>Select prediction result</option>
            </select>
            <div class="card mt-3 flex-grow-1">
                <div class="card-body d-flex">
                    <div class="flex-grow-1 position-relative">
                        <svg id="graph" style="width: 100%; height: 100%"></svg>
                    </div>

                    <div class="right-panel ms-3 border-start ps-3">
                        <ul class="nav nav-tabs nav-tabs-justified" id="panelTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="tab1-tab" data-bs-toggle="tab" data-tab="details" type="button" role="tab">Details</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="tab2-tab" data-bs-toggle="tab" data-tab="suspicious" type="button" role="tab">Suspicious</button>
                            </li>
                        </ul>

                        <div id="infoPanel" class="tab-content mt-2">
                            <div id="tab-details-content" class="tab-content-inner">
                                <div id="infoContent" class="mb-2">
                                    <p>Select node or relation to show data</p>
                                </div>
                                <div id="explainControl" class="mb-2 d-flex gap-2" style="display:none;">
                                    <button id="explainNodeBtn" class="btn btn-outline-primary btn-sm w-100">
                                        Explain
                                    </button>
                                    <span id="explainInfoBtn"  style="cursor:pointer; font-size:20px; padding-bottom:20px; display:inline-flex; align-items:center;"
                                          data-bs-toggle="tooltip" data-bs-placement="right" title="Explanations are available only for predictions generated by supervised methods without GraphSMOTE."
                                    >
                                    <span class="material-symbols-outlined" style="font-size:20px">info</span>
                                    </span>
                                </div>
                                <div id="suspicionControl" style="display:none;" class="mt-3">
                                    <label for="suspicionSlider" class="form-label">
                                        Suspicion score: <span id="suspicionValue">1.00</span>
                                    </label>
                                    <input type="range" class="form-range" id="suspicionSlider" min="0" max="1" step="0.01" value="1"/>
                                </div>
                                <button id="markSuspiciousBtn" class="btn btn-outline-danger mt-auto mt-5" style="display: none; width: 100%">Update Suspicious Score</button>
                            </div>

                            <div id="tab-suspicious-content" class="tab-content-inner" style="display: none;">
                                <label for="susThreshold">Suspicious threshold (0-1):</label>
                                <div class="d-flex align-items-center" style="padding-left: 20px; padding-bottom: 20px">
                                    <input type="number" id="susThreshold" class="form-control bg-white shadow-md rounded px-8"
                                            placeholder="0-1" max="1" min="0" step="0.01" value="0.5"
                                            style="width: 80px"/>
                                    <button id="susThresholdButton" class="btn btn-primary btn-sm ms-2">Set</button>
                                </div>

                                <div id="suspiciousList" class="mb-2">
                                    <p>No suspicious nodes</p>
                                </div>
                                <button id="exportJsonBtn" class="btn btn-outline-info mt-2 w-100">Export Updated JSON</button>
                                <button id="exportSuspiciousJsonBtn" class="btn btn-outline-danger mt-2 w-100">Export Suspicious Nodes Only</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <template id="suspiciousNodeTemplate">
        <div class="mb-2 border-bottom pb-2 suspicious-node-wrapper">
            <div class="d-flex justify-content-between align-items-center header" style="cursor: pointer;">
                <span class="node-id">Node: </span>
                <div>
                    <i class="bi bi-chevron-down me-2 toggle-icon" style="font-size: 1rem;"></i>
                    <i class="bi bi-trash text-danger delete-icon" style="font-size: 1rem; cursor: pointer;" title="Remove from suspicious"></i>
                </div>
            </div>
            <div class="mt-1 details" style="display: none;"></div>
        </div>
    </template>
</div>
